- name: Provisioning roboshop servers and route53 records
  hosts: localhost
  connection: local
  vars:
    servers: ["mongodb","redis","mysql","rabbitmq","catalogue","user","cart","frontend"]
    instance_type: t3.micro
    ami_id: ami-0055977a6e828a4f4
    action: create
    domain_name: anilkumarpatnana.online
  tasks:
    - name: "{{action}} ec2 instances for roboshop."
      amazon.aws.ec2_instance:
            name: "roboshop-{{item}}"
            instance_type: "{{ instance_type }}"
            image_id: "{{ ami_id }}"
            security_groups:
             - roboshop-common-ssh
             - "roboshop-{{ item }}"
            region: "us-east-1"
            state: "{{ 'present' if action == 'create' else 'absent' }}"
      loop: "{{ servers }}"
      register: ec2_output

    - name: "{{ action }} route53 records for backend servers (Private IP)"
      amazon.aws.route53:
        state: "{{ 'present' if action == 'create' else 'absent' }}"
        zone: "{{ domain_name }}"
        record: "roboshop.{{ item.item }}.{{ domain_name }}"
        value: "{{ item.instances[0].private_ip_address if action == 'create' else omit }}"
        type: "A"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: item.item != 'frontend'

    - name: "{{ action }} route53 record for frontend server (Public IP)"
      amazon.aws.route53:
        state: "{{ 'present' if action == 'create' else 'absent' }}"
        zone: "{{ domain_name }}"
        record: "roboshop.{{ item.item }}.{{ domain_name }}"
        value: "{{ item.instances[0].public_ip_address if action == 'create' else omit }}"
        type: "A"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: item.item == 'frontend'
    - name: Print private IPs of roboshop servers
      ansible.builtin.debug:
         msg: "Private IP of {{ item.item }} is {{ item.instances[0].private_ip_address }}"
      loop: "{{ ec2_output.results }}"
      loop_control:
        label: "{{ item.item }}"  
      when: action == "create"
        
