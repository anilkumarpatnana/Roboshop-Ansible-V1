- name: Configuring shipping server
  hosts: shipping
  become: yes
  tasks:
    - name: Enabling module maven:3.9
      ansible.builtin.command: dnf module enable maven:3.9 -y
    - name: Installing maven and java25
      ansible.builtin.package:
                name: "{{item}}"
                state: present
      loop:
        - maven
        - java-25-openjdk-devel
    - name: settingup JAVA_HOME
      ansible.builtin.shell: echo "export JAVA_HOME=$(dirname $(dirname $(readlink -f /usr/bin/java)))" > /etc/profile.d/java.sh && source /etc/profile.d/java.sh && echo $JAVA_HOME
    - name: Creating /app directory
      ansible.builtin.file:
              path: /app
              state: directory
    - name: Creating user roboshop for running shipping service
      ansible.builtin.user:
              name: roboshop
              shell: /sbin/nologin
              home: /app
    - name: Downloading application to /tmp
      ansible.builtin.shell: curl -L -o /tmp/shipping.zip https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
    - name: unzipping files to /app
      ansible.builtin.unarchive:
                src: /tmp/shipping.zip
                dest: /app/
                remote_src: yes
    - name: Set default Java version to Java 25
      ansible.builtin.alternatives:
        name: java
        path: /usr/lib/jvm/java-25-openjdk/bin/java
    - name: Build the application
      ansible.builtin.command: mvn clean package
      args:
       chdir: /app
    - name: Build the application
      ansible.builtin.command: mv target/shipping.jar shipping.jar
      args:
       chdir: /app
    - name: Installing MySQL client 
      ansible.builtin.package:
              name: MySQL
              state: present
    - name: Loading shipping data to mysql-server using MySQL client
      ansible.builtin.shell: mysql -h roboshop.mysql.anilkumarpatnana.online -uroot -pRoboShop@1 < /app/db/master-data.sql
    - name: Creating app user, The application logs in as shipping, not as root, and it can only use the cities database
      ansible.builtin.shell: mysql -h roboshop.mysql.anilkumarpatnana.online -uroot -pRoboShop@1 < /app/db/app-user.sql
    - name: Copying shipping service file to /etc/systemd/system/shipping.service
      ansible.builtin.copy:
              src: shipping.service
              dest: /etc/systemd/system/shipping.service
    - name: Adding Cart ip address in shipping service file /etc/systemd/system/shipping.service
      ansible.builtin.replace:
              path: /etc/systemd/system/shipping.service
              regexp: '<CART-SERVER-IPADDRESS>'
              replace: roboshop.cart.anilkumarpatnana.online
    - name: Adding Mysql ip address in shipping service file /etc/systemd/system/shipping.service
      ansible.builtin.replace:
              path: /etc/systemd/system/shipping.service
              regexp: '<MYSQL-SERVER-IPADDRESS>'
              replace: roboshop.mysql.anilkumarpatnana.online
    - name: Reloading systemd daemon
      ansible.builtin.systemd:
              daemon_reload: true
    - name: Starting and enabling shipping service 
      ansible.builtin.service:
              name: shipping
              state: started
              enabled: yes

     


   
